<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Emerald Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="45%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Golden Leaf & Stem Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Vibrant Emerald Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Rose Petal Radiant Gradient -->
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="40%" stop-color="#fb7185" />
      <stop offset="80%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Inner Rose Glow -->
    <radialGradient id="roseGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffe4e6" />
      <stop offset="60%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#be123c" />
    </radialGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="256" cy="256" r="244" fill="url(#bgGrad)" stroke="#10b981" stroke-width="8" stroke-opacity="0.4" />

  <!-- Outer Golden Dashed Ring Accent -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-dasharray="14 8" opacity="0.9" />

  <!-- Botanical Emblem Container with Shadow -->
  <g filter="url(#shadow)">
    <!-- White Botanical Leaf Crest Contour -->
    <path d="M256 100 C370 100 420 180 400 310 C370 380 290 400 256 410 C222 400 142 380 112 310 C92 180 142 100 256 100 Z" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

    <!-- Left Sprouting Emerald Leaf -->
    <path d="M256 360 C176 360 115 300 125 210 C155 210 220 230 256 290 Z" fill="url(#leafGrad)" />
    <!-- Left Leaf Vein -->
    <path d="M256 360 C218 315 172 265 125 210" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85" />

    <!-- Right Sprouting Green Leaf -->
    <path d="M256 360 C336 360 397 300 387 210 C357 210 292 230 256 290 Z" fill="url(#leafGrad)" />
    <!-- Right Leaf Vein -->
    <path d="M256 360 C294 315 340 265 387 210" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85" />

    <!-- Nursery Central Plant Stem (Golden) -->
    <line x1="256" y1="240" x2="256" y2="400" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Blooming Rose Core Circle (Shivansh Rose) -->
    <circle cx="256" cy="200" r="66" fill="url(#roseGlow)" stroke="#ffffff" stroke-width="5" />

    <!-- Outer Rose Petal Fold Rings -->
    <path d="M210 180 C225 155 287 155 302 180" fill="none" stroke="#ffe4e6" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
    <path d="M205 215 C215 245 297 245 307 215" fill="none" stroke="#ffe4e6" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Bold Central "S" Monogram for Shivansh Rose Nursery -->
    <!-- Crisp Drop Shadow / Backdrop for S -->
    <text x="257" y="213" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="76" font-weight="900" fill="#881337" text-anchor="middle" dominant-baseline="central" letter-spacing="-2">S</text>
    <!-- Crisp Foreground White "S" -->
    <text x="256" y="211" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="76" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="-2">S</text>

    <!-- Small Golden Sparkle Stars -->
    <polygon points="256,52 261,66 276,71 261,76 256,90 251,76 236,71 251,66" fill="#fde047" opacity="0.95" />
    <polygon points="380,125 384,135 394,138 384,141 380,151 376,141 366,138 376,135" fill="#fde047" opacity="0.9" />
    <polygon points="132,125 136,135 146,138 136,141 132,151 128,141 118,138 128,135" fill="#fde047" opacity="0.9" />
  </g>
</svg>
